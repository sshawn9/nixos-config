# Replace this SNMPv2 community or add an SNMPv3 auth before adding targets.
auths:
  public_v2:
    community: public
    security_level: noAuthNoPriv
    auth_protocol: MD5
    priv_protocol: DES
    version: 2

modules:
  system:
    walk:
      - 1.3.6.1.2.1.1
    metrics:
      - name: sysDescr
        oid: 1.3.6.1.2.1.1.1
        type: DisplayString
        help: A textual description of the entity.

      - name: sysUpTime
        oid: 1.3.6.1.2.1.1.3
        type: gauge
        help: Time since the network management subsystem was initialized.

      - name: sysName
        oid: 1.3.6.1.2.1.1.5
        type: DisplayString
        help: The administratively assigned name of the managed node.

      - name: sysLocation
        oid: 1.3.6.1.2.1.1.6
        type: DisplayString
        help: The physical location of the managed node.
