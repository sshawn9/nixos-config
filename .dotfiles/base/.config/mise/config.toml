[settings]
# NixOS can run mise's precompiled Python builds through nix-ld.
all_compile = false

# Inside a uv project (identified by uv.lock), create/source its .venv so
# `python` resolves to the project environment, including in subdirectories.
python.uv_venv_auto = "create|source"
