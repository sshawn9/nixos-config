RIGHT seek  5 exact
LEFT seek -5 exact

UP add volume  5
DOWN add volume -5

Alt+RIGHT seek  30
Alt+LEFT seek -30

Shift+RIGHT seek  120
Shift+LEFT seek -120

[ cycle playlist-pos down
] cycle playlist-pos up
Alt+s playlist-shuffle
Alt+u playlist-unshuffle

p script-binding uosc/items
o script-binding uosc/open-file
m script-binding uosc/menu
t script-message-to uosc toggle-elements timeline

SPACE cycle pause
f cycle fullscreen
s screenshot

Ctrl+3 cycle video-triple
Alt+n script-binding next_subtitle/toggle
